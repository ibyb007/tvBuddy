name: tvBuddy - Build & Release

# Manual only: Actions tab > "tvBuddy - Build & Release" > Run workflow
#
#   stable : normal GitHub *Release*     tag v<version>            e.g. v1.2.0        shown as "1.2.0"
#   canary : GitHub *Pre-release*        tag v<stable>-canary.<n>  e.g. v1.2.0-canary.1  shown as "1.2.0 (1)"
#
# Canary numbers count up from 1 after every stable release: stable 1.2.0 is followed by 1.2.0 (1), 1.2.0 (2), ...
# until the next stable (1.2.1 / 1.3.0 / ...) restarts the count. The in-app updater (Settings > About) reads these
# releases: the Stable channel only offers stable releases, the Canary channel offers both.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        options: [ canary, stable ]
        default: canary
      version:
        description: "Stable only: version number, e.g. 1.2.0 (no leading v). Must be higher than the last stable."
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # needed to create releases / tags

env:
  # run every JavaScript action on Node 24 (softprops/action-gh-release has no Node 24 tag yet)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BASE_VERSION: "1.0.0"   # canary base before the first stable release exists

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ---------- Work out channel / version ----------
      - name: Resolve channel and version
        id: meta
        shell: bash
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet || true

          # newest stable release (tags like v1.2.0); canaries after it are numbered from it
          LAST_STABLE="$( { git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's/^v//' | sort -V | tail -n1 )"
          # highest version any tag was made for (stable or canary base)
          HIGHEST="$( { git tag -l | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-canary\.[0-9]+)?$' || true; } \
                      | sed -E 's/^v//; s/-canary\.[0-9]+$//' | sort -V | tail -n1 )"

          if [[ "$INPUT_CHANNEL" == "stable" ]]; then
            CHANNEL="stable"
            VERSION="${INPUT_VERSION#v}"
            if [[ -z "$VERSION" ]]; then echo "::error::Stable runs need a 'version' input, e.g. 1.2.0"; exit 1; fi
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Version must look like 1.2.0"; exit 1; fi
            if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then echo "::error::Tag v${VERSION} already exists"; exit 1; fi
            # must be higher than every earlier stable AND than the base of earlier canaries, otherwise
            # devices on a canary of that version would never be offered it
            if [[ -n "$HIGHEST" && ( "$VERSION" == "$HIGHEST" || "$(printf '%s\n%s\n' "$VERSION" "$HIGHEST" | sort -V | tail -n1)" != "$VERSION" ) ]]; then
              echo "::error::Stable version $VERSION must be higher than $HIGHEST"; exit 1
            fi
            VERSION_NAME="$VERSION"
            TAG="v${VERSION}"
            TITLE="${VERSION}"
            PRERELEASE=false
          else
            CHANNEL="canary"
            BASE="${LAST_STABLE:-$BASE_VERSION}"
            LAST_N="$( { git tag -l "v${BASE}-canary.*" || true; } | sed -E 's/.*-canary\.//' | sort -n | tail -n1 )"
            N=$(( ${LAST_N:-0} + 1 ))
            VERSION_NAME="${BASE}-canary.${N}"
            TAG="v${VERSION_NAME}"
            TITLE="Canary ${BASE} (${N})"
            PRERELEASE=true
          fi

          {
            echo "channel=$CHANNEL"
            echo "version_name=$VERSION_NAME"
            echo "version_code=${GITHUB_RUN_NUMBER}"
            echo "tag=$TAG"
            echo "title=$TITLE"
            echo "prerelease=$PRERELEASE"
            echo "apk_name=tvBuddy-${VERSION_NAME}.apk"
          } >> "$GITHUB_OUTPUT"
          echo "Channel=$CHANNEL  Version=$VERSION_NAME  Tag=$TAG  Title=$TITLE"

      # ---------- Release notes: the 4 newest changes since the previous release ----------
      - name: Generate release notes
        shell: bash
        env:
          CHANNEL: ${{ steps.meta.outputs.channel }}
        run: |
          set -euo pipefail
          # stable: changes since the previous stable release; canary: since the previous release of any kind
          if [[ "$CHANNEL" == "stable" ]]; then
            PREV="$( { git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n1 )"
          else
            PREV="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          fi
          if [[ -n "$PREV" ]]; then RANGE="${PREV}..HEAD"; else RANGE="HEAD"; fi

          git log "$RANGE" --no-merges --pretty='%s' -n 100 \
            | sed -E 's/^[A-Za-z]+(\([^)]*\))?!?:[[:space:]]*//' \
            | grep -v -i -E '^(merge |wip|update readme|bump |release )' \
            | awk 'NF && !seen[tolower($0)]++' \
            | head -n 4 \
            | sed -E 's/^(.)/\U\1/; s/^/- /' > changes.md || true

          if [[ ! -s changes.md ]]; then echo "- Maintenance and stability improvements" > changes.md; fi

          {
            if [[ "$CHANNEL" == "canary" ]]; then
              echo "> [!IMPORTANT]"
              echo "> **Canary builds are for testing and may contain bugs or regressions.** If you prefer a reliable experience, stay on the **Stable** channel."
              echo
            fi
            echo "### What's changed"
            cat changes.md
          } > release-notes.md
          cat release-notes.md

      # ---------- Toolchain ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # The ubuntu runner already ships an Android SDK. We only accept licenses so AGP
      # can auto-download the platform it needs. (android-actions/setup-android was
      # failing on "sdkmanager tools", so it has been removed.)
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      # The repo has no gradlew / gradle-wrapper.jar, so install the Gradle version
      # the project's wrapper properties ask for (9.3.1, required by AGP 9.1).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      # ---------- Signing ----------
      # app/build.gradle.kts expects ${rootDir}/debug.keystore (git-ignored) for debug builds.
      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Add RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD (key alias must be "upload")
      # as repo secrets so every release is signed with the SAME key and users can update in place.
      # Without them a throwaway key is generated, which means APKs can't update over each other.
      - name: Set up release keystore
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "Using release keystore from secrets"
            echo "$KS_B64" | base64 --decode > "$GITHUB_WORKSPACE/release.jks"
            echo "STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASS:-$KS_PASS}" >> "$GITHUB_ENV"
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret - using a temporary CI key (APKs won't be update-compatible)"
            keytool -genkeypair -v -keystore "$GITHUB_WORKSPACE/release.jks" -storepass android -keypass android \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=tvBuddy,OU=CI,O=OpenSource,C=US"
            echo "STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"

      # ---------- WARP binary ----------
      # WARP mode runs a patched build of usque (https://github.com/Diniboy1123/usque) as a local
      # HTTP proxy. native-src/usque/main.go adds USQUE_DNS_SERVERS support, because Android apps
      # have no readable /etc/resolv.conf; native-src/usque/prefer-ipv6.patch makes it dial IPv6 first. Built here (not committed) so it stays reproducible.
      - name: Set up Go for WARP binary build
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'

      - name: Build patched libusque (Cloudflare WARP) for Android
        run: |
          set -e
          USQUE_COMMIT="6aa03fc97d12"
          git clone --quiet https://github.com/Diniboy1123/usque.git /tmp/usque-src
          cd /tmp/usque-src
          git checkout --quiet "$USQUE_COMMIT"
          cp "$GITHUB_WORKSPACE/native-src/usque/main.go" ./main.go
          # IPv6-first dialling (shared WARP IPv4 exit addresses are blocked by many sites)
          git apply "$GITHUB_WORKSPACE/native-src/usque/prefer-ipv6.patch"

          build_abi() {
            local goarch="$1" goarm="$2" abi="$3"
            echo "Building libusque.so for $abi (GOARCH=$goarch${goarm:+, GOARM=$goarm})"
            mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi"
            CGO_ENABLED=0 GOOS=linux GOARCH="$goarch" GOARM="$goarm" \
              go build -trimpath -ldflags="-s -w" \
              -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/libusque.so" .
          }

          build_abi arm64 "" arm64-v8a
          build_abi arm 7 armeabi-v7a

      # ---------- Build ----------
      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace --no-daemon
        # Don't let a flaky test block a canary pre-release; stable must pass.
        continue-on-error: ${{ steps.meta.outputs.channel == 'canary' }}

      - name: Build release APK
        run: >
          gradle assembleRelease --stacktrace --no-daemon
          -PappVersionName="${{ steps.meta.outputs.version_name }}"
          -PappVersionCode="${{ steps.meta.outputs.version_code }}"

      - name: Collect APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          test -n "$APK" || { echo "::error::No release APK found"; exit 1; }
          mkdir -p dist
          cp "$APK" "dist/${{ steps.meta.outputs.apk_name }}"
          (cd dist && sha256sum "${{ steps.meta.outputs.apk_name }}" > "${{ steps.meta.outputs.apk_name }}.sha256")
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: tvBuddy-${{ steps.meta.outputs.channel }}-apk
          path: dist/*
          retention-days: 30

      # ---------- Release ----------
      # A real GitHub Release (stable) or Pre-release (canary) with the APK attached - not just a tag.
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: ${{ steps.meta.outputs.title }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
        run: |
          set -euo pipefail
          args=( "$TAG" "dist/${APK_NAME}" "dist/${APK_NAME}.sha256"
                 --target "$GITHUB_SHA" --title "$TITLE" --notes-file release-notes.md )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=( --prerelease --latest=false )
          else
            args+=( --latest )
          fi
          gh release create "${args[@]}"

      # Keep only the 10 newest canary pre-releases so the Releases page stays tidy.
      - name: Prune old canary releases
        if: steps.meta.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq '[.[] | select((.tagName | test("-canary\\.")) or (.tagName | startswith("canary-")))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' \
          | while read -r tag; do
              echo "Deleting old canary $tag"
              gh release delete "$tag" --cleanup-tag --yes || true
            done
